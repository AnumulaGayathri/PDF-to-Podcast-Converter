<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | PDF Podcast</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg: #f7f8fa;
            --card: #ffffff;
            --border: #d7dce5;
            --text: #1f2a44;
            --muted: #6b7484;
            --primary: #1f4f84;
            --radius: 14px;
            --shadow: 0 10px 25px rgba(31, 48, 83, 0.08);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: var(--bg);
            font-family: 'Poppins', sans-serif;
            color: var(--text);
            padding: 1rem;
        }

        .auth-card {
            width: min(420px, 100%);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 1.8rem;
        }

        h2 {
            margin: 0 0 0.75rem;
            font-weight: 700;
            color: var(--primary);
            font-size: 1.5rem;
        }

        p {
            color: var(--muted);
            margin: 0 0 1rem;
        }

        .field { margin-bottom: 1rem; display: flex; flex-direction: column; }

        label {
            font-size: 0.9rem;
            margin-bottom: 0.35rem;
            font-weight: 500;
        }

        input[type='text'],
        input[type='password'],
        input[type='email'] {
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.72rem 0.8rem;
            font-size: 0.95rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(31,79,132,0.12);
            outline: none;
        }

        .btn {
            border: none;
            background: var(--primary);
            color: white;
            border-radius: 10px;
            padding: 0.75rem;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            font-weight: 600;
            transition: background 0.2s ease;
        }

        .btn:hover {
            background: #153865;
        }

        .link-group {
            margin-top: 1rem;
            font-size: 0.9rem;
            text-align: center;
            color: var(--muted);
        }

        .link-group a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .link-group a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2>Create your account</h2>
        <p>Register to start converting PDFs to podcasts in a few clicks.</p>
        <form method="POST" novalidate>
            {% csrf_token %}
            {% for field in form %}
                <div class="field">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <span style="color:#d12d2d;font-size:0.85rem;">{{ field.errors|striptags }}</span>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="btn">Register</button>
        </form>

        <div class="link-group">
            <span>Already have an account? <a href="/login/">Login</a></span>
        </div>
    </div>
</body>
</html>
